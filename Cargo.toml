[workspace]
members = ["crates/wgsql", "crates/wgsql-cli", "crates/wgsql-wasm", "examples"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["wgsql contributors"]
repository = "https://github.com/shiahonb777/wgsql"

[workspace.dependencies]
wgpu = "23"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
arrow = { version = "54", default-features = false, features = ["ipc"] }
parquet = { version = "54", default-features = false, features = ["arrow"] }
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1
